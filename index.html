<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Core SEO -->
    <title>Ntohnwi Bih | Software Engineer & Developer Portfolio</title>
    <meta name="description" content="Portfolio of Ntohnwi Bih, a Software Engineer specializing in modern web development, full-stack applications, and scalable digital solutions." />
    <meta name="keywords" content="Ntohnwi Bih, Software Engineer, Web Developer, Full Stack Developer, Portfolio" />
    <meta name="author" content="Ntohnwi Bih" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ntohnwibih.com/" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ntohnwibih.com/" />
    <meta property="og:title" content="Ntohnwi Bih | Software Engineer & Developer Portfolio" />
    <meta property="og:description" content="Explore selected projects, experience, and software engineering work by Ntohnwi Bih." />
    <meta property="og:image" content="https://ntohnwibih.com/og-image.jpg" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ntohnwibih.com/" />
    <meta name="twitter:title" content="Ntohnwi Bih | Software Engineer & Developer Portfolio" />
    <meta name="twitter:description" content="Explore selected projects, experience, and software engineering work by Ntohnwi Bih." />
    <meta name="twitter:image" content="https://ntohnwibih.com/og-image.jpg" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ntohnwi Bih",
        "url": "https://ntohnwibih.com",
        "jobTitle": "Software Engineer",
        "sameAs": [
          "https://github.com/your-github-username",
          "https://linkedin.com/in/your-linkedin-username"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
